[pytest]
# E-Rakshak production test discovery configuration
pythonpath =
    .
    apps
    packages
    analysis
    analysis/static
    sandbox/host

testpaths =
    analysis
    apps/backend/tests
    apps/ingestion
    sandbox/host/tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async testing configuration
asyncio_mode = auto

filterwarnings =
    ignore::DeprecationWarning
