[pytest]
# Test dirs are packages (they have __init__.py) but their test modules use
# flat imports so they can also be run from inside the directory. Each dir
# ships a conftest.py that puts itself on sys.path; see stages/conftest.py.
pythonpath =
    .
    backend
    static-analysis/src

testpaths =
    agents
    dynamic-sandbox/stages
    dynamic-sandbox/hooks
    static-analysis/tests
    backend/tests
    ingestion

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Stage-pipeline tests are async.
asyncio_mode = auto

filterwarnings =
    ignore::DeprecationWarning
