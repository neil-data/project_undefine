# render.yaml — E-Rakshak Production Infrastructure Blueprint
# Single source of truth for Render backend services & data stores

databases:
  - name: e-rakshak-db
    databaseName: ps4_malware
    user: ps4
    plan: free

services:
  # 1. E-Rakshak Backend API (100% Free Plan)
  - type: web
    name: e-rakshak-backend
    runtime: docker
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: e-rakshak-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOW_DB_FALLBACK
        value: "0"
      - key: ALLOW_DEV_JWT_SECRET
        value: "0"
      - key: CORS_ORIGINS
        value: "https://project-undefine.vercel.app,http://localhost:3000,http://localhost:5173"
      - key: INGESTION_SAMPLES_DIR
        value: "/tmp/ingestion_samples"
      - key: REDIS_URL
        sync: false
      - key: ELASTICSEARCH_URL
        sync: false
      - key: MOBSF_URL
        sync: false
      - key: HYBRID_ANALYSIS_API_KEY
        sync: false
      - key: MALWARE_BAZAAR_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MOBSF_API_KEY
        sync: false

