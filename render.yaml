databases:
  - name: e-rakshak-db
    databaseName: ps4_malware
    user: ps4
    plan: free

services:
  - type: web
    name: e-rakshak-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: e-rakshak-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOW_DB_FALLBACK
        value: "0"
      - key: ALLOW_DEV_JWT_SECRET
        value: "0"
      - key: CORS_ORIGINS
        value: "https://project-undefine.vercel.app,http://localhost:3000,http://localhost:5173"
      - key: INGESTION_SAMPLES_DIR
        value: "/tmp/ingestion_samples"
