[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "e-rakshak-agents"
version = "0.1.0"
description = "E-Rakshak AI Agents"
dependencies = [
    "langgraph>=0.2.0",
    "pydantic>=2.0",
    "groq>=0.11.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*"]