[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "e-rakshak"
version = "4.1.6"
description = "E-Rakshak: Automated Malware Analysis, Forensic Triage and Reverse Engineering Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "apps",
    "packages",
    "analysis",
    "analysis/static",
    "sandbox/host"
]
testpaths = [
    "analysis",
    "apps/backend/tests",
    "apps/ingestion",
    "sandbox/host/tests"
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning"
]
