services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ps4
      POSTGRES_PASSWORD: ps4pass
      POSTGRES_DB: ps4_malware
    ports:
      - "5434:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"

  mobsf:
    image: opensecurity/mobile-security-framework-mobsf:latest
    container_name: ps4_mobsf
    environment:
      - MOBSF_HOME=/home/mobsf/.MobSF
    ports:
      - "8003:8000"
    volumes:
      - mobsf_data:/home/mobsf/.MobSF
    privileged: true # required for the built-in dynamic analyzer (emulator)
    # devices:
    #   - /dev/kvm:/dev/kvm # required for Android emulator hardware acceleration (Linux host only)
    restart: unless-stopped

  # SentinelScan API
  backend:
    image: e-rakshak-backend:v3.0
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # DOCKER_DATABASE_URL allows overriding for container setups, while defaulting
      # to the internal 'postgres' service container. This avoids inheriting a local
      # dev '.env' DATABASE_URL pointing to localhost:5434 which causes crash-loops.
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://ps4:ps4pass@postgres:5432/ps4_malware}
      ALLOW_DB_FALLBACK: ${ALLOW_DB_FALLBACK:-0}
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      INGESTION_SAMPLES_DIR: /app/ingestion_samples
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # ":?" makes compose refuse to start rather than substitute a default.
      # This previously fell back to a constant committed to the repo, so every
      # container built from it shared one publicly-known signing key.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env — generate with python -c "import secrets; print(secrets.token_urlsafe(48))"}
      ALLOW_DEV_JWT_SECRET: ${ALLOW_DEV_JWT_SECRET:-0}
      GEOIP_DB_PATH: ${GEOIP_DB_PATH:-}
      MALWARE_BAZAAR_API_KEY: ${MALWARE_BAZAAR_API_KEY:-}

    volumes:
      - ingestion_samples:/app/ingestion_samples
    depends_on:
      - postgres
      - redis
      - elasticsearch
    restart: unless-stopped

  # Ingestion Gateway (Layer 1) — hashes+saves uploads, runs India-scam
  # pre-triage, and pushes jobs onto the "isolation_queue" Redis list that
  # backend's ingestion_worker.py consumes. Shares the same sample-storage
  # volume as `backend` so a saved file is actually reachable by the
  # consumer, not just written into a container that then throws it away.
  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    ports:
      - "8002:8001"
    environment:
      REDIS_URL: redis://redis:6379
      INGESTION_SAMPLES_DIR: /app/ingestion_samples
    volumes:
      - ingestion_samples:/app/ingestion_samples
    depends_on:
      - redis
    restart: unless-stopped

  # SentinelScan Frontend (Dashboard & Threat Console)
  frontend:
    image: e-rakshak-frontend:v3.0
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE=http://localhost:8000/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pg_data:
  mobsf_data:
  ingestion_samples:
